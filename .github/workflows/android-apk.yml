name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android native project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Generate CI signing keystore and sign APK
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          mkdir -p artifacts

          # Sign using a deterministic CI keystore if unsigned
          if echo "$RAW_APK" | grep -q "unsigned"; then
            keytool -genkeypair -v \
              -keystore ci-release.keystore \
              -alias splittrack \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass splittrackci \
              -keypass splittrackci \
              -dname "CN=Splittrack, OU=Mobile, O=Splittrack, L=Remote, S=Remote, C=US"

            ZIPALIGN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name "zipalign" | sort -V | tail -n 1)
            APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name "apksigner" | sort -V | tail -n 1)

            "$ZIPALIGN" -f -v -p 4 "$RAW_APK" artifacts/Splittrack-aligned.apk
            "$APKSIGNER" sign \
              --ks ci-release.keystore \
              --ks-key-alias splittrack \
              --ks-pass pass:splittrackci \
              --key-pass pass:splittrackci \
              --out artifacts/Splittrack-release.apk \
              artifacts/Splittrack-aligned.apk
            rm -f artifacts/Splittrack-aligned.apk
          else
            cp "$RAW_APK" artifacts/Splittrack-release.apk
          fi

          ls -lh artifacts/Splittrack-release.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Splittrack-android-apk
          path: artifacts/Splittrack-release.apk
          if-no-files-found: error
