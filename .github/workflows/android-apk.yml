name: Build Android APK
"on":
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
env:
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
  GOOGLE_ANDROID_CERTIFICATE_SHA1: ${{ secrets.GOOGLE_ANDROID_CERTIFICATE_SHA1 }}
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_API_KEY }}
  RELEASE_CONTROL_URL: ${{ vars.RELEASE_CONTROL_URL }}
  PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO }}
  EXPO_PUBLIC_UPDATE_MANIFEST_URL: ${{ vars.EXPO_PUBLIC_UPDATE_MANIFEST_URL }}
concurrency:
  group: splittrack-android-release
  cancel-in-progress: false
jobs:
  build-apk:
    if: github.ref == 'refs/heads/android' && github.actor != 'github-actions[bot]'
    name: Build Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate release control configuration
        env:
          RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: test -n "$RELEASE_CONTROL_URL" && test -n "$PUBLIC_RELEASE_REPO" && test -n "$EXPO_PUBLIC_UPDATE_MANIFEST_URL" && test -n "$RELEASE_TOKEN" || { echo 'Complete the release repository variables and secret before building.'; exit 1; }
      - name: Resolve binary release commit
        id: release_repo
        run: node scripts/prepare-release-ref.mjs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate cloud app configuration
        run: node scripts/validate-build-env.mjs
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi
      - name: Install dependencies
        run: npm ci
      - name: Validate Android auth and offline transactions
        run: node --test scripts/*.test.mjs
      - name: Stamp Android build version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const build = Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(build) || build < 1) throw new Error('Invalid Android build number');
          config.expo.android.versionCode = (config.expo.android.versionCode || 1) + build;
          const [major, minor] = config.expo.version.split('.');
          config.expo.version = `${major}.${minor}.${build}`;
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          console.log(`Android version ${config.expo.version}, versionCode ${config.expo.android.versionCode}`);
          NODE
      - name: Prebuild Android native project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test
      - name: Package and verify Android APK
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found under android/app/build/outputs/apk/release"
            exit 1
          fi
          mkdir -p artifacts
          ZIPALIGN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name "apksigner" | sort -V | tail -n 1)

          # Reuse Expo's generated testing key so successive APKs can update in place.
          if echo "$RAW_APK" | grep -q "unsigned"; then
            test -f android/app/debug.keystore

            "$ZIPALIGN" -f -v -p 4 "$RAW_APK" artifacts/Splittrack-aligned.apk
            "$APKSIGNER" sign \
              --ks android/app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out artifacts/Splittrack-release.apk \
              artifacts/Splittrack-aligned.apk
            rm -f artifacts/Splittrack-aligned.apk
          else
            cp "$RAW_APK" artifacts/Splittrack-release.apk
          fi

          "$APKSIGNER" verify artifacts/Splittrack-release.apk
          "$APKSIGNER" verify --print-certs artifacts/Splittrack-release.apk > artifacts/android-signing-certificate.txt
          cat artifacts/android-signing-certificate.txt >> "$GITHUB_STEP_SUMMARY"
          node scripts/verify-android-google.mjs artifacts/android-signing-certificate.txt
          ls -lh artifacts/Splittrack-release.apk
          sha256sum artifacts/Splittrack-release.apk >> "$GITHUB_STEP_SUMMARY"
      - name: Verify native GL callbacks in optimized APK
        run: python3 scripts/verify-android-release.py artifacts/Splittrack-release.apk
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Splittrack-android-apk
          path: |
            artifacts/Splittrack-release.apk
            artifacts/android-signing-certificate.txt
          if-no-files-found: error
          retention-days: 3
      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: splittrack-android-${{ github.run_number }}
          name: Splittrack Android (build ${{ github.run_number }})
          body: |-
            Automated android build from commit ${{ github.sha }}.
            Availability is controlled by the public version manifest.
          files: artifacts/Splittrack-release.apk
          fail_on_unmatched_files: true
          make_latest: false
          repository: ${{ vars.PUBLIC_RELEASE_REPO }}
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          target_commitish: ${{ steps.release_repo.outputs.ref }}
          generate_release_notes: false
      - name: Register build for release approval
        env:
          BUILD_PLATFORM: android
        run: node scripts/register-release-build.mjs
