name: Build Unsigned iOS IPA
"on":
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
env:
  EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_API_KEY }}
  PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO }}
  EXPO_PUBLIC_UPDATE_MANIFEST_URL: ${{ vars.EXPO_PUBLIC_UPDATE_MANIFEST_URL }}
  RELEASE_CONTROL_URL: ${{ vars.RELEASE_CONTROL_URL }}
concurrency:
  group: splittrack-ios-release
  cancel-in-progress: false
jobs:
  build-unsigned-ios:
    if: github.ref == 'refs/heads/ios' && github.actor != 'github-actions[bot]'
    name: Build and publish unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release control configuration
        env:
          RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: test -n "$RELEASE_CONTROL_URL" && test -n "$PUBLIC_RELEASE_REPO" && test -n "$EXPO_PUBLIC_UPDATE_MANIFEST_URL" && test -n "$RELEASE_TOKEN" || { echo 'Complete the release repository variables and secret before building.'; exit 1; }
      - name: Resolve binary release commit
        id: release_repo
        run: node scripts/prepare-release-ref.mjs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate cloud app configuration
        run: node scripts/validate-build-env.mjs
      - name: Read app version and prepare build number
        id: app
        run: |
          RAW_VERSION=$(node -p "require('./app.json').expo.version")
          BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          RELEASE_TAG="splittrack-ios-$BUILD_NUMBER"

          if [ -z "$RAW_VERSION" ] || [ -z "$BUNDLE_ID" ]; then
            echo "Error: Missing expo.version or expo.ios.bundleIdentifier in app.json"
            exit 1
          fi

          # Derive monotonically increasing semantic version (e.g. 1.0.10) so SideStore update comparator triggers
          APP_VERSION=$(node -p "const p = '$RAW_VERSION'.split('.'); (p.length >= 2 ? p.slice(0, 2).join('.') : '1.0') + '.' + '$BUILD_NUMBER'")

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install npm dependencies
        run: npm ci
      - name: Validate mobile auth, build routing and settled-only ledger reset
        run: node --test scripts/android-google-auth.test.mjs scripts/mobile-workflows.test.mjs scripts/ledger-reset.test.mjs scripts/settings-import-action.test.mjs
      - name: Generate native iOS project (Expo Prebuild)
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --no-install
      - name: Sync iOS Info.plist version and numeric build number
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
          BUILD_NUMBER: ${{ steps.app.outputs.build_number }}
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
        run: |
          set -euo pipefail
          INFO_PLIST=$(find ios -maxdepth 2 -name "Info.plist" -not -path "*/Pods/*" | head -n 1)
          if [ -z "$INFO_PLIST" ]; then
            echo "Error: Info.plist not found under ios/"
            find ios -maxdepth 3 || true
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST"

          echo "Configured $INFO_PLIST ($BUNDLE_ID -> $APP_VERSION ($BUILD_NUMBER))"
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
      - name: Build unsigned iOS Release app
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
          BUILD_NUMBER: ${{ steps.app.outputs.build_number }}
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No .xcworkspace generated inside ios/"
            ls -la ios
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"
          echo "Building version=$APP_VERSION build=$BUILD_NUMBER"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: Package .app into unsigned .ipa and verify bundle metadata
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
          BUILD_NUMBER: ${{ steps.app.outputs.build_number }}
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
        run: |
          set -euo pipefail
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found in ios/build/Build/Products/Release-iphoneos"
            find ios/build -maxdepth 4 || true
            exit 1
          fi

          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")

          echo "Verified IPA Info.plist -> bundleId=$ACTUAL_BUNDLE_ID version=$ACTUAL_VERSION build=$ACTUAL_BUILD"

          if [ "$ACTUAL_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "Bundle identifier mismatch: expected $BUNDLE_ID, got $ACTUAL_BUNDLE_ID"
            exit 1
          fi

          if [ "$ACTUAL_VERSION" != "$APP_VERSION" ] || [ "$ACTUAL_BUILD" != "$BUILD_NUMBER" ]; then
            echo "Version mismatch: expected $APP_VERSION ($BUILD_NUMBER), got $ACTUAL_VERSION ($ACTUAL_BUILD)"
            exit 1
          fi

          rm -rf build-ipa Splittrack-unsigned.ipa
          mkdir -p build-ipa/Payload
          ditto "$APP_PATH" "build-ipa/Payload/$(basename "$APP_PATH")"
          (cd build-ipa && zip -qry ../Splittrack-unsigned.ipa Payload)

          if ! unzip -l Splittrack-unsigned.ipa | grep -q "Payload/.*\.app/Info\.plist"; then
            echo "Error: Invalid IPA layout — missing Payload/*.app/Info.plist"
            exit 1
          fi

          ls -lh Splittrack-unsigned.ipa
          shasum -a 256 Splittrack-unsigned.ipa | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Splittrack-unsigned-ipa
          path: Splittrack-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Publish IPA as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app.outputs.release_tag }}
          name: Splittrack iOS ${{ steps.app.outputs.version }} (build ${{ steps.app.outputs.build_number }})
          body: |-
            Automated ios build from commit ${{ github.sha }}.
            Availability is controlled by the public version manifest.
          files: Splittrack-unsigned.ipa
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
          repository: ${{ vars.PUBLIC_RELEASE_REPO }}
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          target_commitish: ${{ steps.release_repo.outputs.ref }}
      - name: Register build for release approval
        env:
          BUILD_PLATFORM: ios
          APP_VERSION: ${{ steps.app.outputs.version }}
          BUILD_NUMBER: ${{ steps.app.outputs.build_number }}
        run: node scripts/register-release-build.mjs
